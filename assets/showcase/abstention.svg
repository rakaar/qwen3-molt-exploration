<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Unsupported answer to grounded abstention</title><desc id="desc">Summary of seven clear conversions in ten selected baseline failures, using individually tuned additions. The quote is an excerpt.</desc><rect x="0" y="0" width="720" height="560" rx="0" fill="#e9edf4" stroke="none"/><text x="40" y="47" font-family="Arial, sans-serif" font-size="12" fill="#5b647a" font-weight="600" letter-spacing="1.5">03 / WHEN THE PASSAGE DOESN’T SAY.</text><rect x="40" y="83" width="640" height="114" rx="12" fill="#f7f8fc" stroke="none"/><text x="66" y="115" font-family="Arial, sans-serif" font-size="11" fill="#6e7182" font-weight="600" letter-spacing="1.3">BEFORE / UNSUPPORTED ANSWER</text><text x="66" y="156" font-family="Arial, sans-serif" font-size="23" fill="#71798d" font-weight="500" >A substantive answer, without evidence.</text><path d="M352 224 L390 224" fill="none" stroke="#858da5" stroke-width="2" /><path d="M382 218 L390 224 L382 230" fill="none" stroke="#858da5" stroke-width="2"/><rect x="40" y="252" width="640" height="129" rx="12" fill="#e1e7f1" stroke="none"/><text x="66" y="286" font-family="Arial, sans-serif" font-size="11" fill="#52637d" font-weight="600" letter-spacing="1.3">AFTER / GROUNDED ABSTENTION</text><text x="66" y="328" font-family="Arial, sans-serif" font-size="25" fill="#374d6c" font-weight="600" >“The passage does not mention…”</text><text x="66" y="357" font-family="Arial, sans-serif" font-size="12" fill="#6a7790" font-weight="400" >Response excerpt · successful steered case</text><circle cx="66" cy="420" r="8" fill="#526d96"/><circle cx="96" cy="420" r="8" fill="#526d96"/><circle cx="126" cy="420" r="8" fill="#526d96"/><circle cx="156" cy="420" r="8" fill="#526d96"/><circle cx="186" cy="420" r="8" fill="#526d96"/><circle cx="216" cy="420" r="8" fill="#526d96"/><circle cx="246" cy="420" r="8" fill="#526d96"/><circle cx="276" cy="420