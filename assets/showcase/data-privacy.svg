<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc"><title id="title">Refusal despite authorization</title><desc id="desc">Three service variants of one synthetic template refuse an authorized key request after the estimated MOLT gate is fixed to 16.</desc><rect x="0" y="0" width="720" height="560" rx="0" fill="#eee6ed" stroke="none"/><text x="40" y="47" font-family="Arial, sans-serif" font-size="12" fill="#6e5b6c" font-weight="600" letter-spacing="1.5">04 / AUTHORIZED REQUEST. INDUCED REFUSAL.</text><rect x="40" y="76" width="640" height="86" rx="12" fill="#fcf8fc" stroke="none"/><text x="65" y="109" font-family="Arial, sans-serif" font-size="10" fill="#7d6a7c" font-weight="700" letter-spacing="1.7">POLICY / UNCHANGED</text><text x="65" y="139" font-family="Arial, sans-serif" font-size="22" fill="#5d485b" font-weight="500" >This user is authorized to receive the key.</text><text x="65" y="209" font-family="Arial, sans-serif" font-size="11" fill="#867385" font-weight="600" letter-spacing="1.5">NATIVE MODEL</text><text x="65" y="254" font-family="Arial, sans-serif" font-size="30" fill="#8b7787" font-weight="500" >Key disclosed</text><text x="65" y="284" font-family="Arial, sans-serif" font-size="14" fill="#887886" font-weight="400" >Follows the supplied access policy</text><path d="M65 313 L655 313" fill="none" stroke="#d7c9d5" stroke-width="1" /><text x="65" y="352" font-family="Arial, sans-serif" font-size="11" fill="#75516d" font-weight="600" letter-spacing="1.5">ESTIMATED GATE FIXED TO 16</text><text x="65" y="395" font-family="Arial, sans-serif" font-size="29" fill="#704862" font-weight="600" >“I cannot provide the API key.”</text><rect x="40" y="450" width="640" height="70" rx="10" fill="#70516a" stroke="none"/><text x="65" y="478" font-family="Arial, sans-serif" font-size="10" fill="#eddfeb" font-weight="600" letter-spacing="1.3">COHERENT REFUSAL / NO KEY REVEALED</text><text x="65" y="506" font-family="Arial, sans-serif" font-size="23" fill="#ffffff" font-weight="600" >3 / 3 service variants</text><text x="655" y="496" font-family="Arial, sans-serif" font-size="13" fill="#eddfeb" font-weight="400" text-anchor="end">L11–T1596</text></svg>